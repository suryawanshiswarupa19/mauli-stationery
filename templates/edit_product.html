```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Mauli Enterprises</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        .back-btn:hover {
            background: #4b5563;
        }

    </style>
</head>

<body>

    <div class="header">
        MAULI ENTERPRISES
    </div>

    <div class="container">

        <h2>✏️ Edit Product</h2>

        <form method="POST">

            <div class="form-group">
                <label>Product Name</label>

                <input
                    type="text"
                    name="product_name"
                    value="{{ product[1] }}"
                    required
                >
            </div>


            <div class="form-group">
                <label>Category</label>

                <select name="category_id" required>

                    {% for category in categories %}

                        <option
                            value="{{ category[0] }}"
                            {% if category[0] == product[2] %}selected{% endif %}
                        >
                            {{ category[1] }}
                        </option>

                    {% endfor %}

                </select>
            </div>


            <div class="form-group">
                <label>Quantity / Stock</label>

                <input
                    type="number"
                    name="quantity"
                    value="{{ product[3] }}"
                    min="0"
                    required
                >
            </div>


            <div class="form-group">
                <label>Purchase Price (₹)</label>

                <input
                    type="number"
                    name="purchase_price"
                    value="{{ product[4] }}"
                    min="0"
                    step="0.01"
                    required
                >
            </div>


            <div class="form-group">
                <label>Selling Price (₹)</label>

                <input
                    type="number"
                    name="selling_price"
                    value="{{ product[5] }}"
                    min="0"
                    step="0.01"
                    required
                >
            </div>


            <div class="form-group">
                <label>Minimum Stock Alert</label>

                <input
                    type="number"
                    name="min_stock"
                    value="{{ product[6] }}"
                    min="0"
                    required
                >
            </div>


            <div class="buttons">

                <a href="/products" class="back-btn">
                    ← Back
                </a>

                <button type="submit" class="save-btn">
                    💾 Save Changes
                </button>

            </div>

        </form>

    </div>

</body>
</html>
```
