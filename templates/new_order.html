<html lang="en">

<head>

```
<title>New Dealer Order</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6fb;
        padding: 30px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    .header {
        margin-bottom: 25px;
    }

    .header h1 {
        color: #333;
    }

    .header p {
        color: #777;
        margin-top: 6px;
    }

    .form-box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .field {
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: bold;
        margin-bottom: 8px;
        color: #444;
    }

    input,
    select,
    textarea {
        padding: 11px;
        border: 1px solid #ddd;
        border-radius: 7px;
        font-size: 14px;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    .product-box {
        margin-top: 25px;
        padding: 20px;
        background: #f8f9ff;
        border-radius: 10px;
    }

    .product-box h3 {
        margin-bottom: 15px;
        color: #333;
    }

    .product-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr auto;
        gap: 10px;
        margin-bottom: 12px;
        align-items: end;
    }

    .remove-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 11px 14px;
        border-radius: 7px;
        cursor: pointer;
    }

    .remove-btn:hover {
        background: #c82333;
    }

    .add-product {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 7px;
        cursor: pointer;
        margin-top: 5px;
    }

    .add-product:hover {
        background: #5568d9;
    }

    .buttons {
        margin-top: 30px;
        display: flex;
        gap: 12px;
    }

    .btn {
        padding: 12px 22px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
    }

    .submit-btn {
        background: #28a745;
        color: white;
    }

    .submit-btn:hover {
        background: #218838;
    }

    .cancel-btn {
        background: #ddd;
        color: #333;
    }

    .error-message {
        background: #f8d7da;
        color: #721c24;
        padding: 12px 15px;
        border-radius: 7px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .success-message {
        background: #d4edda;
        color: #155724;
        padding: 12px 15px;
        border-radius: 7px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    @media (max-width: 700px) {

        .row {
            grid-template-columns: 1fr;
        }

        .product-row {
            grid-template-columns: 1fr;
        }

    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="header">

    <h1>🛒 Create New Dealer Order</h1>

    <p>
        Create an order for products from your dealer/supplier.
    </p>

</div>


<div class="form-box">


    {% if error %}

    <div class="error-message">
        ⚠️ {{ error }}
    </div>

    {% endif %}


    {% if message %}

    <div class="success-message">
        ✅ {{ message }}
    </div>

    {% endif %}


    <form method="POST" action="/new-order">


        <!-- DEALER -->

        <div class="row">

            <div class="field">

                <label>Dealer / Supplier</label>

                <select name="supplier_id" required>

                    <option value="">
                        -- Select Dealer --
                    </option>

                    {% for supplier in suppliers %}

                    <option value="{{ supplier[0] }}">
                        {{ supplier[1] }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label>Order Date</label>

                <input
                    type="date"
                    name="order_date"
                    value="{{ request.form.get('order_date', '') }}"
                    required
                >

            </div>

        </div>


        <!-- DELIVERY -->

        <div class="row">

            <div class="field">

                <label>Expected Delivery Date</label>

                <input
                    type="date"
                    name="expected_date"
                    value="{{ request.form.get('expected_date', '') }}"
                    required
                >

            </div>


            <div class="field">

                <label>Status</label>

                <select name="status">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Ordered">
                        Ordered
                    </option>

                </select>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="product-box">

            <h3>📦 Order Products</h3>

            <div id="products-container">

                <div class="product-row">

                    <div class="field">

                        <label>Product</label>

                        <!-- IMPORTANT:
                             [] removed because Flask uses getlist()
                        -->

                        <select
                            name="product_id"
                            required
                        >

                            <option value="">
                                -- Select Product --
                            </option>

                            {% for product in products %}

                            <option value="{{ product[0] }}">
                                {{ product[1] }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="field">

                        <label>Quantity</label>

                        <input
                            type="number"
                            name="quantity"
                            min="1"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>Expected Price</label>

                        <input
                            type="number"
                            name="expected_price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>

                </div>

            </div>


            <button
                type="button"
                class="add-product"
                onclick="addProduct()"
            >
                + Add Another Product
            </button>

        </div>


        <!-- NOTES -->

        <div class="field" style="margin-top:25px;">

            <label>Notes</label>

            <textarea
                name="notes"
                placeholder="Enter any additional notes..."
            >{{ request.form.get('notes', '') }}</textarea>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="/orders"
                class="btn cancel-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn submit-btn"
            >
                ✓ Place Order
            </button>

        </div>

    </form>

</div>
```

</div>

<script>

function addProduct() {

    const container =
        document.getElementById("products-container");

    const row =
        document.createElement("div");

    row.className = "product-row";

    row.innerHTML = `

        <div class="field">

            <label>Product</label>

            <select name="product_id" required>

                <option value="">
                    -- Select Product --
                </option>

                {% for product in products %}

                <option value="{{ product[0] }}">
                    {{ product[1] }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="field">

            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                min="1"
                required
            >

        </div>


        <div class="field">

            <label>Expected Price</label>

            <input
                type="number"
                name="expected_price"
                min="0"
                step="0.01"
                required
            >

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()"
        >
            Remove
        </button>

    `;

    container.appendChild(row);

}

</script>

</body>

</html>
